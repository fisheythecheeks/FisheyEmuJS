<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DS Emulator</title>
  <style>
    body, html { margin: 0; padding: 0; background: #000; }
  </style>
</head>
<body>
  <div style="width:100%;height:100%;max-width:100%">
    <div id="game"></div>
  </div>
  <script>
    EJS_player = "#game";
    EJS_core = "nds"; // uses melonDS by default
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    EJS_biosUrl = "bios/nds_bios.zip"; // zip containing bios7.bin, bios9.bin, firmware.bin
    EJS_gameUrl = "roms/pokemonblack2.nds";
    EJS_gameName = "Pokémon Black 2";
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
